<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>商品一覧・ダーク表示検証</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#fff;color:#111;font:14px "Segoe UI","Yu Gothic UI",sans-serif}header{margin-bottom:22px}h1{font-size:25px;margin:0 0 8px}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px;max-width:1160px;margin:auto}aside{background:#ececec;border:1px solid #ccc;border-radius:7px;padding:16px;height:510px}aside h2{font-size:15px}a{color:#0873c4;text-decoration:none}.list{display:grid;gap:11px}h2.strip{font-size:16px;color:#ccc;background:linear-gradient(#fff,#ddd);border:1px solid #aaa;margin:0;padding:9px 14px}.filter{background:#fff;border:1px solid #ccc;border-radius:5px;overflow:hidden}.tags{padding:14px;display:flex;gap:8px;flex-wrap:wrap}.tags span{background:#e9edf1;color:#000;padding:9px;border-radius:3px}.catalog{background:white!important;border:1px solid #bbb}.grid{display:grid;grid-template-columns:repeat(4,1fr)}.card{background:white;color:#111;border-right:1px dotted #777;border-bottom:1px dotted #777;min-height:230px;padding:15px 11px}.brand{color:#bbb;font-size:12px;margin:9px 0 3px}.price{color:red;font-size:19px;font-weight:bold;margin:12px 0 2px}.stars{color:#dd9100}.photo{display:block;width:120px;height:74px;margin:12px auto;object-fit:contain}.badge{color:#111;position:relative;padding-left:25px}.badge:before{content:"1";position:absolute;left:0;top:0;background:#ffe800;color:#111;padding:3px 6px}.legacy{background:white!important;color:black!important;-webkit-text-fill-color:black!important;padding:12px;margin-top:12px;border:1px solid #aaa}input,button{background:white;color:black;border:1px solid #bbb;padding:9px}input::placeholder{color:#bbb}.dynamic{background:#fff;color:#222;padding:12px;margin-top:10px}.mixed{background:#181818;color:#eee}.mixed .catalog,.mixed .card,.mixed .filter{background:white!important}.dark{color-scheme:dark}.dark body{background:#171b22;color:#e4e8ed}.dark aside,.dark .filter,.dark .catalog,.dark .card,.dark .legacy,.dark .tags span{background:#222a36!important;color:#e4e8ed!important;-webkit-text-fill-color:currentColor!important}.dark .strip{background:linear-gradient(#273140,#1d2632);color:#fff}.dark a{color:#91bdff}.dark .brand{color:#c0c7d2}.dark .price{color:#ff9090}.dark input,.dark button{background:#263040;color:#eee}.dark .badge{color:#eee}.dark .badge:before{background:#493a12;color:#fff}
</style></head><body><header class="layout"><div>Adaptive Dark<br>表示検証ページ</div><div><h1>SSD 人気売れ筋ランキング</h1><span>白いカード・薄い文字・グラデーションのある商品一覧</span></div></header><div class="layout"><aside><h2>メーカー</h2><div class="list"><a href="#">エレコム (131)</a><a href="#">Sandisk (204)</a><a href="#">Lexar (28)</a><a href="#">ADATA (80)</a><a href="#">Samsung (129)</a></div><h2>容量</h2><div class="list"><a href="#">500GB</a><a href="#">1TB</a><a href="#">2TB</a><a href="#">4TB</a></div></aside><main><div class="filter"><h2 class="strip">SSD 人気検索条件</h2><div class="tags"><span>規格サイズ: M.2</span><span>容量: 1TB</span><span>NVMe</span><span>容量: 2TB</span></div></div><section class="catalog" style="margin-top:16px"><h2 class="strip">SSD 人気売れ筋ランキング</h2><div class="grid" id="cards"></div></section><div class="legacy" id="legacy" style="background:white!important;color:black!important">インライン !important の黒文字と白背景も読みやすくします。</div><p><input placeholder="薄いプレースホルダー"><button>検索</button></p><div id="shadow"></div><div id="added"></div></main></div>
<script>
const image='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="74"><rect x="8" y="21" width="104" height="34" rx="4" fill="#222"/><rect x="17" y="28" width="78" height="20" fill="#404753"/><text x="25" y="42" fill="white" font-size="12">NVMe SSD</text><rect x="107" y="26" width="7" height="24" fill="#c6a547"/></svg>');
for(let i=0;i<8;i++){const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="badge">ランキング ${i+1}</div><img class="photo" src="${image}" alt="SSD 製品イラスト"><p class="brand">メーカー ${i+1}</p><a href="#">NVMe SSD ${i%2?'2TB':'1TB'} 高速モデル</a><p class="price">¥${(8980+i*4000).toLocaleString()}</p><span class="stars">★ 4.86</span>`;document.getElementById('cards').append(card)}
const shadow=document.getElementById('shadow').attachShadow({mode:'open'});shadow.innerHTML='<style>.surface{background:white;color:black;padding:12px}.surface::before{content:"Shadow DOM: ";color:#aaa}</style><div class="surface">Web Components の白背景と黒文字</div>';
</script></body></html>
